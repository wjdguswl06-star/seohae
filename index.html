<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서해 탐험대 – 화성 바다와 갯벌 도감을 완성하라!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
[hidden]{display:none!important}
:root{--acc:#ff7a59;--acc2:#ffb199;--gold:#ffcf33;--nat:#34b26b;--hum:#5b7cfa;--ink:#2b2b3a;--bg:#fffaf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
button{font-family:inherit;cursor:pointer}
.chip{background:#fff;border:3px solid #fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;white-space:nowrap}
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top > *{pointer-events:auto}
#top .sp{flex:1}
#region{background:var(--acc);color:#fff}
.lv{color:var(--acc)}
.xpbar{width:70px;height:10px;background:#eee;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f1a);transition:width .3s}
.ib{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--acc);font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.ib small{font-size:9px;color:#fff;font-weight:800;margin-top:1px}
#tidechip{background:#e6f4ff}
#quest{position:absolute;left:10px;top:66px;max-width:340px;background:rgba(255,255,255,.95);border:3px solid #fff;border-radius:18px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.qarrow{width:34px;height:34px;flex:none;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.qt{font-weight:900;font-size:15px}
.qh{font-size:13px;color:#555;line-height:1.35;margin-top:2px}
.qd{font-size:12px;font-weight:800;color:var(--acc);white-space:nowrap}
#mini{position:absolute;right:10px;top:66px;width:180px;height:140px;border:3px solid #fff;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.18);background:#cfe9f7;cursor:pointer}
#prompt{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2);border:3px solid var(--acc);white-space:nowrap;cursor:pointer}
kbd{background:var(--acc);color:#fff;border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:900}
#tabs{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.9);padding:6px;border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#tabs button{border:none;background:#fff3ea;border-radius:14px;padding:6px 10px;font-size:20px;display:flex;flex-direction:column;align-items:center;min-width:58px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#tabs button span{font-size:11px;font-weight:800;color:#444;margin-top:2px}
#tabs button:active{transform:translateY(2px)}
#tabs button.hot{background:var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:30}
.toast{background:#2b2b3a;color:#fff;padding:9px 18px;border-radius:999px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.good{background:var(--nat)}.toast.gold{background:#ff9f1a}.toast.blue{background:var(--hum)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#dialog{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(640px,94vw);background:#fff;border:4px solid var(--acc);border-radius:22px;padding:14px;display:flex;gap:12px;box-shadow:0 7px 0 rgba(0,0,0,.25);z-index:20}
.dicon{font-size:44px;width:62px;height:62px;flex:none;background:#fff3ea;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dbody{flex:1}
.dwho{font-weight:900;color:var(--acc);font-size:15px}
.dtext{font-size:17px;line-height:1.55;margin-top:3px;word-break:keep-all}
.dchoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dchoices button,.btn{border:3px solid #fff;background:var(--acc);color:#fff;font-weight:900;font-size:15px;border-radius:14px;padding:9px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#dNext{align-self:flex-end;border:none;background:var(--acc);color:#fff;font-weight:900;border-radius:12px;padding:8px 14px;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(20,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:25;padding:12px}
.mbox{position:relative;background:var(--bg);border:4px solid #fff;border-radius:24px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.mclose{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:#ff6b6b;color:#fff;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mbox h2{margin:0 0 10px;font-size:22px}
.mbox h3{margin:14px 0 8px;font-size:17px}
.mbox p{line-height:1.6;word-break:keep-all}
.card{text-align:center}
.card .big{font-size:64px}
.card p{text-align:left;background:#fff;border-radius:14px;padding:12px 14px}
.two{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.two button{flex:1;min-width:140px;font-size:19px;padding:14px}
.nat{background:var(--nat)!important}.hum{background:var(--hum)!important}
.fb{margin-top:12px;border-radius:14px;padding:12px;text-align:left;line-height:1.6;font-weight:600}
.fb.ok{background:#e3f7ea;border:3px solid var(--nat)}.fb.no{background:#ffecec;border:3px solid #ff6b6b}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{border:3px solid #fff;background:#fff;color:var(--ink);font-weight:800;font-size:16px;border-radius:14px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.15);text-align:left}
.opts button.right{background:#c9f2d6}.opts button.wrong{background:#ffd5d5}
.dexcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dexcol h3{margin:0 0 8px;color:#fff;border-radius:12px;padding:6px 10px}
.dexcol.N h3{background:var(--nat)}.dexcol.H h3{background:var(--hum)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dexitem{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.1);font-size:13px;font-weight:800;cursor:pointer}
.dexitem .i{font-size:30px}
.dexitem.no{opacity:.55;cursor:default}
.dexitem.miss{border-color:#ffb3b3}
.mlist{display:flex;flex-direction:column;gap:6px}
.mi{background:#fff;border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;font-weight:700}
.mi .s{font-size:20px}
.mi small{display:block;font-weight:500;color:#666}
.mi.done{opacity:.6}.mi.now{border:3px solid var(--acc)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.album figure{margin:0;background:#fff;padding:6px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.album img{width:100%;border-radius:8px;display:block}
.album figcaption{font-size:12px;font-weight:700;text-align:center;margin-top:4px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.shop button{background:#fff;border:3px solid #fff;border-radius:14px;padding:10px 4px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.shop button.on{border-color:var(--acc);background:#fff3ea}
.shop .sw{width:36px;height:36px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}
.shop .hi{font-size:30px}
.boss{text-align:center}
.hpbar{height:16px;background:#eee;border-radius:9px;overflow:hidden;margin:8px auto;max-width:360px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ff9f1a);transition:width .3s}
.hearts{font-size:24px}
.bossq{font-size:19px;font-weight:800;background:#fff;border-radius:14px;padding:14px;margin-top:10px;line-height:1.5;word-break:keep-all}
.cert{background:#fff;border:6px double #d4a017;border-radius:16px;padding:24px;text-align:center}
.cert h1{margin:6px 0;font-size:28px;color:#b8860b}
.cert .nm{font-size:30px;font-weight:900;margin:10px 0}
#photoUI{position:fixed;inset:0;z-index:22;pointer-events:none}
#photoUI .frame{position:absolute;left:20%;right:20%;top:20%;bottom:20%;border:4px dashed #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
#photoUI .hint{position:absolute;left:50%;top:12%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:17px;text-shadow:0 2px 4px #000;white-space:nowrap}
#shutter{pointer-events:auto;position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:var(--acc);font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#photoClose{pointer-events:auto;position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#ff6b6b;color:#fff;font-size:18px;font-weight:900}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:18px;bottom:96px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#tbtns{position:absolute;right:16px;bottom:96px;display:grid;grid-template-columns:repeat(2,62px);gap:10px}
#tbtns button{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:var(--acc);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.25);color:#fff;font-weight:900;touch-action:manipulation}
body.touch #prompt kbd{display:none}
#start,#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(160deg,var(--acc2),var(--acc))}
.sbox{background:var(--bg);border:5px solid #fff;border-radius:28px;padding:26px;width:min(560px,100%);max-height:94vh;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.logo{font-size:56px}
.sbox h1{margin:6px 0 4px;font-size:28px;line-height:1.25;word-break:keep-all}
.sbox .sub{color:#666;font-weight:700;margin:0 0 14px;word-break:keep-all}
.sbox input{width:100%;font-size:19px;padding:12px;border-radius:14px;border:3px solid #eee;text-align:center;font-family:inherit;font-weight:800}
.sbox .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sbox .row .btn{flex:1;font-size:18px;padding:13px}
.btn.gray{background:#9aa0aa}
.how{text-align:left;background:#fff;border-radius:16px;padding:12px 16px;margin-top:14px;font-size:14px;line-height:1.7}
.how b{color:var(--acc)}
.bus{font-size:60px;animation:drive 1.2s ease-in-out infinite}
@keyframes drive{50%{transform:translateX(16px) rotate(-3deg)}}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:700;margin-top:8px}
.legend span{background:#fff;border-radius:999px;padding:3px 10px}
#bigmap{width:100%;border-radius:14px;display:block;background:#cfe9f7}
@media (max-width:640px){
 #quest{max-width:calc(100vw - 20px);top:60px;padding:6px 10px}
 .qh{display:none}
 #mini{top:auto;bottom:96px;width:120px;height:94px;right:auto;left:50%;transform:translateX(-50%)}
 body.touch #mini{display:none}
 #tabs button{min-width:46px;padding:5px 6px;font-size:18px}
 #tabs button span{font-size:10px}
 .chip{font-size:13px;padding:3px 9px}
 .xpbar{width:44px}
 .dexcols{grid-template-columns:1fr}
 .opts{grid-template-columns:1fr}
 .ib{width:40px;height:40px;font-size:19px}
 #top{gap:5px}
 #top > .chip:nth-child(4){display:none}
 #quest{top:58px;max-width:calc(100vw - 110px)}
 body.touch #prompt{bottom:auto;top:128px;font-size:14px}
 .xpbar{display:none}
 #top .sp{display:none}
 #tbtns{grid-template-columns:repeat(2,52px);gap:8px;bottom:92px}
 #tbtns button{width:52px;height:52px;font-size:20px}
 #joy{bottom:92px;width:110px;height:110px}
 #knob{left:30px;top:30px}
 #tabs{gap:3px;padding:4px;max-width:calc(100vw - 12px)}
 #tabs button{min-width:0;flex:1;padding:4px 5px}
 #dialog{bottom:84px}
 .dtext{font-size:15px}
}

.more{background:#fff8e1;border:3px solid #ffe08a;border-radius:14px;padding:12px 14px;margin-top:12px;text-align:left;line-height:1.65;word-break:keep-all}
.photo-btn{display:block;margin-top:12px;background:#03c75a;color:#fff;font-weight:900;text-decoration:none;border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.realimg{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:12px}

</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div class="chip" id="region">📍 <b id="rname"></b></div>
    <div class="chip"><span class="lv">Lv.<b id="lv">1</b></span><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="chip">🪙 <b id="coins">0</b></div>
    <div class="chip">📖 도감 <b id="dexpct">0%</b></div>
    <div class="chip" id="tidechip" hidden></div>
    <div class="sp"></div>
    <button class="ib" id="bMap" title="지도 (M)">🗺️</button>
    <button class="ib" id="bHelp" title="도움말 (H)">❔</button>
  </div>
  <div id="quest">
    <div class="qarrow" id="qArrow">➤</div>
    <div style="flex:1"><div class="qt" id="qTitle"></div><div class="qh" id="qHint"></div></div>
    <div class="qd" id="qDist"></div>
  </div>
  <canvas id="mini" width="360" height="280" title="크게 보기"></canvas>
  <div id="prompt" hidden><kbd>E</kbd> <span id="promptText"></span></div>
  <nav id="tabs">
    <button data-m="missions" title="미션 (Q)">🎯<span>미션</span></button>
    <button data-m="dex" title="도감 (Tab)">📖<span>도감</span></button>
    <button id="bPhoto" title="사진 찍기 (C)">📷<span>사진</span></button>
    <button data-m="album">🖼️<span>앨범</span></button>
    <button data-m="closet">👕<span>옷장</span></button>
    <button data-m="boss" id="bBoss">🦉<span>박사 시험</span></button>
  </nav>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div id="tbtns">
      <button id="tIn">＋</button><button id="tOut">－</button>
      <button id="tJump">⤒</button><button id="tAct">✋</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div id="dialog" hidden>
  <div class="dicon" id="dIcon"></div>
  <div class="dbody"><div class="dwho" id="dWho"></div><div class="dtext" id="dText"></div><div class="dchoices" id="dChoices"></div></div>
  <button id="dNext">다음 ▶</button>
</div>

<div id="modal" hidden><div class="mbox"><button class="mclose" id="mClose">✕</button><div id="mbody"></div></div></div>

<div id="photoUI" hidden>
  <div class="frame"></div>
  <div class="hint">📸 찍고 싶은 곳을 네모 안에 넣고 셔터를 눌러요 (C)</div>
  <button id="shutter">📸</button>
  <button id="photoClose">✕</button>
  <div id="flash"></div>
</div>

<div id="loading"><div class="sbox"><div class="bus">🚌</div><h1>탐험 지역을 만드는 중…</h1></div></div>

<div id="start" hidden>
  <div class="sbox">
    <div class="logo" id="sLogo"></div>
    <h1 id="sTitle"></h1>
    <p class="sub" id="sSub"></p>
    <input id="sName" maxlength="10" placeholder="탐험대원 이름을 적어요" autocomplete="off">
    <div class="row" id="sBtns"></div>
    <div class="how" id="sHow"></div>
  </div>
</div>

<script>
(function () {
const coast = [[980, 0], [930, 180], [860, 330], [880, 470], [820, 560], [860, 700], [800, 860], [840, 1020], [780, 1180], [820, 1320], [760, 1500], [800, 1660], [740, 1900]];
const seaPoly = [[0, 0]].concat(coast, [[0, 1900]]);
const mudPoly = coast.concat(coast.slice().reverse().map(p => [p[0] - 170, p[1]]));
const houses = (list, c, roof) => list.map(p => ({ x: p[0], y: p[1], w: 46, h: 36, z: 22, c, roof, kind: 'house', win: false }));

window.GAME = {
  key: 'hwaseong-seobu-explorer-v1',
  title: '서해 탐험대 – 화성 바다와 갯벌 도감을 완성하라!',
  titleHTML: '서해 탐험대<br><span style="font-size:19px">화성 바다·갯벌 도감을 완성하라!</span>',
  subtitle: '갯벌과 섬, 공룡알 화석지에서 포도밭과 항구까지, 화성 서쪽의 자연환경과 인문환경을 찾아요',
  logo: '🧭🌊', regionName: '화성시 서부 (만세구)', color: '#2b9bd6', color2: '#9ad7f5', seed: 23,
  world: { w: 2600, h: 1900, bg: 'grass', outside: '#3f9fd8' },
  spawn: [2450, 1035],
  tide: { low: 45, high: 30 },
  mapNote: '화성 서쪽 바닷가를 탐험하기 좋게 단순하게 바꾼 지도예요. 장소 사이의 거리와 방향은 실제와 다를 수 있어요.',
  howto: '<b>움직이기</b> 방향키·WASD (태블릿은 왼쪽 조이스틱) · Shift 달리기 · Space 점프<br><b>살펴보기</b> E 또는 ✋ — ❓ 표지판, 사람, 케이블카 승강장<br><b>도감</b> Tab · <b>미션</b> Q · <b>지도</b> M · <b>사진</b> C · <b>확대/축소</b> 마우스 휠, ＋/－<br>🌊 <b>밀물·썰물</b>: 썰물 때만 바닷길과 갯벌이 드러나요. 위쪽 시간을 확인해요!',
  areas: [
    { t: 'sea', poly: seaPoly },
    { t: 'mud', poly: mudPoly },
    { t: 'water', poly: [[980, 0], [2600, 0], [2600, 110], [2200, 150], [1800, 120], [1400, 160], [1000, 120]], label: '시화호', labelAt: [1900, 60] },
    { t: 'reed', poly: [[1000, 120], [1400, 160], [1800, 120], [2200, 150], [2600, 110], [2600, 520], [1000, 520]], label: '시화호 간척지', labelAt: [1180, 470], lsize: 22 },
    { t: 'mud', ell: [330, 760, 200, 230] },
    { t: 'land', ell: [330, 760, 120, 150], label: '제부도', labelAt: [330, 885], lsize: 22 },
    { t: 'hill', ell: [2050, 330, 170, 120], label: '우음도', labelAt: [2160, 230], lsize: 20 },
    { t: 'plaza', rect: [1330, 300, 240, 110], c: '#e2cfa6' },

  dex: [
    { id: 'mudflat', type: 'N', icon: '🦀', name: '갯벌', desc: '바닷물이 빠지면 드러나는 넓은 진흙 땅이에요. 화성 서해안에는 갯벌이 넓게 펼쳐져 있고, 게·조개·갯지렁이 같은 생물이 많이 살아요.', why: '바닷물과 흙이 오랜 시간 만든 땅이라 자연환경이에요.' },
    { id: 'tide', type: 'N', icon: '🌊', name: '밀물과 썰물', desc: '바닷물은 하루에 두 번씩 들어왔다(밀물) 빠졌다(썰물) 해요. 제부도 바닷길은 썰물 때만 열려서, 통행 시간표를 꼭 확인하고 건너야 해요.', why: '달과 해가 바닷물을 끌어당겨 생기는 자연 현상이라 자연환경이에요.' },
    { id: 'jebu', type: 'N', icon: '🏝️', name: '제부도', desc: '서신면 앞바다의 작은 섬이에요(약 0.98㎢). 썰물이면 하루 두 번 바닷길이 열려 섬에 들어갈 수 있어서 「모세의 기적」이라고도 불러요.', why: '섬은 자연이 만든 땅이라 자연환경이에요. 섬으로 가는 바닷길 도로는 사람이 만든 인문환경이고요!' },
    { id: 'egg', type: 'N', icon: '🥚', name: '공룡알 화석', desc: '약 1억 년 전 중생대 백악기 공룡이 낳은 알이 돌처럼 굳은 화석이에요. 1999년 시화호 간척지에서 발견되었고, 2000년에 천연기념물로 지정되었어요.', why: '아주 오랜 옛날 자연이 남긴 흔적이라 자연환경(자연유산)이에요.' },
    { id: 'uumdo', type: 'N', icon: '🪨', name: '우음도의 바위와 지층', desc: '우음도에서는 땅이 휘어진 습곡, 끊어진 단층 같은 지층을 한곳에서 볼 수 있어 「지질학 교과서」라고 불려요. 예전에는 섬이었지만 간척으로 육지와 이어졌어요.', why: '땅이 오랜 시간 스스로 만든 모습이라 자연환경이에요.' },
    { id: 'tuff', type: 'N', icon: '🌋', name: '전곡항 층상응회암', desc: '아주 오래전 화산재가 층층이 쌓여 굳은 바위예요. 화성 국가지질공원의 지질명소 8곳 가운데 하나예요.', why: '자연이 만든 바위라 자연환경이에요.' },
    { id: 'wind', type: 'N', icon: '🎐', name: '해풍(바닷바람)', desc: '바다에서 불어오는 바람이에요. 서해안의 풍부한 햇빛과 해풍은 송산포도가 달게 익는 데 도움을 줘요.', why: '바람과 햇빛은 사람이 만들 수 없는 자연환경이에요.' },
    { id: 'bird', type: 'N', icon: '🐦', name: '철새(저어새)', desc: '화성호와 매향리 갯벌 일대는 철새들이 쉬어 가는 곳이에요. 멸종위기 새인 저어새도 찾아와요.', why: '새와 같은 생물은 자연환경이에요.' },
    { id: 'vine', type: 'H', icon: '🍇', name: '송산 포도밭', desc: '1980년대 후반, 시화방조제를 만들며 생긴 간척지에서 포도를 기르기 시작했어요. 2015년에는 전국 최초로 「노지 포도 스마트팜」을 도입해 스마트폰으로 물 주기와 환기를 조절해요.', why: '사람이 땅을 일구어 만든 밭이라 인문환경이에요.' },
    { id: 'reclaim', type: 'H', icon: '🚜', name: '간척지', desc: '바다나 갯벌을 둑(방조제)으로 막아 만든 땅이에요. 1994년 시화호 방조제가 생긴 뒤, 이곳의 갯벌은 드넓은 들판이 되었어요.', why: '사람이 바다를 막아 새로 만든 땅이라 인문환경이에요.' },
    { id: 'jeongok', type: 'H', icon: '⛵', name: '전곡항', desc: '요트와 보트가 머무는 마리나 시설이 있는 항구예요. 전국 최초로 레저 어항 시범지역으로 선정되었고, 방파제 덕분에 밀물·썰물과 상관없이 배가 드나들 수 있어요.', why: '사람이 배를 대고 바다를 즐기려고 만든 항구라 인문환경이에요.' },
    { id: 'cable', type: 'H', icon: '🚡', name: '해상케이블카', desc: '전곡항에서 제부도까지 바다 위 약 2.12km를 10분 남짓 날아가는 케이블카예요.', why: '바다를 건너려고 사람이 만든 교통 시설이라 인문환경이에요.' },
    { id: 'gungpyeong', type: 'H', icon: '🐟', name: '궁평항', desc: '2008년 국가 어항으로 지정된 항구예요. 고깃배가 드나들고 수산물 시장이 있으며, 바다로 지는 노을(궁평낙조)로 유명해요.', why: '사람이 배를 대려고 만든 항구라 인문환경이에요.' },
    { id: 'village', type: 'H', icon: '🏘️', name: '어촌 마을', desc: '바닷가에 모여 사는 마을이에요. 고기잡이, 조개 캐기처럼 바다와 갯벌을 이용해 살아가는 사람이 많아요.', why: '사람이 모여 사는 마을이라 인문환경이에요.' },
    { id: 'paddy', type: 'H', icon: '🌾', name: '수향미 논', desc: '평평한 땅에 물을 대어 벼를 기르는 논이에요. 화성의 대표 쌀로 「수향미」가 있어요.', why: '사람이 농사를 지으려고 만든 논이라 인문환경이에요.' },
    { id: 'lighthouse', type: 'H', icon: '🗼', name: '빨간 등대', desc: '제부도를 대표하는 풍경인 빨간 등대예요. 등대는 밤에 불빛을 비춰 배가 안전하게 다니도록 도와요.', why: '사람이 배의 안전을 위해 세운 시설이라 인문환경이에요.' },
    { id: 'jeam', type: 'H', icon: '🕊️', name: '제암리 3·1운동 순국기념관', desc: '1919년 3·1운동 때 독립을 외친 사람들과 그 희생을 기억하는 곳이에요. 화성 사람들의 독립운동 정신을 배울 수 있어요.', why: '역사를 기억하려고 사람이 만든 곳이라 인문환경이에요.' }
  ],
  npcs: [
    { id: 'cap', x: 2390, y: 1035, icon: '🧭', name: '바다 대장', color: '#2b9bd6', hat: 'explorer',
      lines: ['반가워, {name} 대원! 나는 서해 탐험대장 바다야.', '여기는 화성의 서쪽, 바다와 갯벌, 포도밭과 논이 있는 곳이야. 아파트가 많은 동탄과는 모습이 많이 다르지?', '바다·갯벌·섬 같은 🌿자연환경과 항구·포도밭·간척지 같은 🏙️인문환경을 찾아 도감을 채워 줘!', '위쪽 🌊 시간도 잘 봐. 밀물이 되면 바닷길과 갯벌이 물에 잠겨!', '먼저 큰길을 따라 서쪽 송산 포도밭의 농부님을 찾아가 봐.'],
      after: ['미션 카드의 화살표(➤)를 따라가면 돼!', '모든 미션을 끝내면 🦉 서해 환경 박사님의 시험을 볼 수 있어.'] },
    { id: 'farmer', x: 1660, y: 945, icon: '👨‍🌾', name: '포도 농부', color: '#7a4fa0', hat: 'straw',
      lines: ['어서 와요! 여기는 송산 포도밭이에요.', '이 땅은 원래 바다와 갯벌이었는데, 사람들이 바다를 막아 땅을 만들었어요. 그런 땅을 간척지라고 해요.', '바다에서 불어오는 바람(해풍)과 풍부한 햇빛 덕분에 포도가 달게 익는답니다.', '요즘은 스마트폰으로 물 주기와 환기를 조절하는 스마트팜도 써요. 포도밭 ❓도 살펴보세요!'],
      after: ['포도밭 북서쪽 바람개비 언덕에 가면 바닷바람을 느낄 수 있어요.'] },
    { id: 'guide', x: 1535, y: 372, icon: '🧑‍🏫', name: '지질공원 해설사', color: '#c98a3a', hat: 'beret',
      lines: ['여기는 공룡알 화석산지예요. 화성은 2024년에 국가지질공원으로 인증받았어요.', '시화호에 방조제를 쌓아 바닷물이 빠지자, 1억 년 전 공룡알이 세상에 드러났답니다.', '화석은 소중한 자연유산이니 눈으로만 보고 만지지 않아요!'] },
    { id: 'captain', x: 1000, y: 525, icon: '🧑‍✈️', name: '요트 선장', color: '#2c3e70', hat: 'cap',

/* ---------- missions ---------- */
const MISSIONS = D.missions;

  if (m.kind === 'dex') { const p = POIS.find(p => p.dex === m.target); return p && [p.x, p.y]; }
  if (m.kind === 'quiz' || m.kind === 'photo') { const p = POI[m.target]; return p && (m.kind === 'photo' && p.look ? [p.x, p.y] : [p.x, p.y]); }

}

}

  sfx('win'); S.coins += co; addXP(xp);

}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  sfx('win'); updateHUD(); save();
  if (isNew) say(D.intro.map(l => Object.assign({}, l)), () => toast('🎯 첫 미션: ' + currentMission().title));
  else toast(`👋 다시 왔군요, ${S.name}!`, 'good');
}
function showStart() {
  $('#loading').hidden = true; $('#start').hidden = false;
  $('#sLogo').textContent = D.logo; $('#sTitle').innerHTML = D.titleHTML; $('#sSub').textContent = D.subtitle; $('#sHow').innerHTML = D.howto;
  const sv = load();
  const btns = $('#sBtns');
  if (sv) { S = sv; $('#sName').value = sv.name || ''; btns.innerHTML = `<button class="btn" id="bCont">이어서 탐험하기 ▶</button><button class="btn gray" id="bNew">처음부터</button>`; $('#bCont').onclick = () => begin(false); $('#bNew').onclick = () => { openModal(`<h2>처음부터 할까요?</h2><p>저장된 도감과 미션 기록이 지워져요.</p><div class="row two"><button class="btn" id="nNo">아니요</button><button class="btn gray" id="nYes">네, 새로 할래요</button></div>`); $('#modal').style.zIndex = 50; $('#nNo').onclick = () => { closeModal(); $('#modal').style.zIndex = ''; }; $('#nYes').onclick = () => { closeModal(); $('#modal').style.zIndex = ''; begin(true); }; }; }
  else { btns.innerHTML = `<button class="btn" id="bNew">탐험 시작! 🚀</button>`; $('#bNew').onclick = () => begin(true); }
  $('#sName').addEventListener('keydown', e => { if (e.key === 'Enter') (sv ? begin(false) : begin(true)); });
}
makePatterns(); buildMap();
requestAnimationFrame(loop);
setTimeout(showStart, 500);
window.__game = { S: () => S, P1, cam, D, walkable, ev, completeMission, MISSIONS, interact, nearest: () => near, setPos: (x, y) => { P1.x = x; P1.y = y; cam.x = x; cam.y = y; }, tide: () => lowTide };
})();

</script>
